name: CI

# Validate the VS Code extension's existing compile, vendor, and smoke-test contract.
# The workflow does not launch a full VS Code GUI or alter repository files.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The lockfile makes npm ci deterministic and prevents CI from silently
      # rewriting the dependency graph.
      - name: Install dependencies
        run: npm ci

      # verify is the project's own full validation command: vendor, compile, tests.
      - name: Run project verification
        run: npm run verify
